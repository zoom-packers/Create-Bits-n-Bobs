org.gradle.jvmargs = -Xmx4G
org.gradle.caching = true

archives_base_name = CreateBitsnBobs
mod_version = 2.3.5.1
# ZP5 NeoForge build number, bumped for every released jar
port_build = zp5.3
maven_group = com.kipti.bnb

minecraft_version = 26.3
minecraft_version_range = [26.3,26.4)
neo_version = 26.3.0.89
neo_version_range = [26.3.0.89,)

# Create Fly's NeoForge 26.3 port (ZP5 mods/create-fly-neoforge). The jar, its access transformer and its
# interface-injection data are snapshotted into libs/ (see PORTING.md).
create_jar = libs/create-fly-neoforge-6.0.9+neoforge-26.3.jar
create_version_range = [6.0.9,)

# Strut Your Stuff, NeoForge 26.3 port (zoom-packers/StrutYourStuff, branch zp5/26.3), copied into libs/
struts_jar = libs/StrutYourStuff-1.3.1+neoforge-26.3-zp5.1.jar
struts_version_range = [1.3.1,)
